[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residential-thermal-benchmark"
version = "1.0.0"
description = "MLP, Random Forest, XGBoost and TreeSHAP for limited-data residential thermal dynamics"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["thermal_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
